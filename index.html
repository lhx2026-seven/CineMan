<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CineMan｜選擇你的電影院</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at top, #241108 0%, #090909 40%, #000 100%);
  color: white;
  font-family: Arial, "Noto Sans TC", sans-serif;
}


/* =========================
   CineMan 標題
========================= */

.header {
  text-align: center;
  padding: 45px 20px 30px;
}

.logo {
  margin: 0;

  font-family: Georgia, serif;
  font-size: clamp(52px, 8vw, 92px);
  font-weight: bold;

  color: #ffd47c;

  text-shadow:
    0 0 2px #fff,
    0 0 6px #ffd36b,
    0 0 12px #ff9d00,
    0 0 25px #ff7200,
    0 0 45px rgba(255, 105, 0, 0.65);
}

.subtitle {
  max-width:560px;
  margin:18px auto 0;
  padding:14px 12px;
  color:#e8cfa4;
  font-family:Georgia, "Noto Serif TC", serif;
  font-size:17px;
  font-weight:normal;
  line-height:1.9;
  letter-spacing:0.12em;
  text-wrap:balance;
}
.subtitle::before, .subtitle::after {
  content:"";
  display:block;
  width:64px;
  height:1px;
  margin:0 auto 12px;
  background:linear-gradient(90deg, transparent, #b98b4b, transparent);
}
.subtitle::after { margin:12px auto 0; }


/* =========================
   卡片區
========================= */

.cards {
  display: flex;
  gap: 16px;

  max-width: 1450px;
  margin: auto;
  padding: 20px;

  justify-content: center;
  flex-wrap: wrap;
}


/* =========================
   卡片共用樣式
========================= */

.cinema-card {

  --neon: #ffffff;

  width: 250px;
  min-height: 360px;

  padding: 22px;

  border: 1px solid var(--neon);
  border-radius: 18px;

  background:
    linear-gradient(
      180deg,
      color-mix(in srgb, var(--neon) 20%, #101010),
      #090909 45%
    );

  box-shadow:
    0 0 8px rgba(255,255,255,0.05),
    0 0 20px color-mix(in srgb, var(--neon) 40%, transparent);

  transition: 0.25s;
}


/* 滑鼠移上去 */

.cinema-card:hover {


  box-shadow:
    0 0 10px color-mix(in srgb, var(--neon) 75%, transparent),
    0 0 28px color-mix(in srgb, var(--neon) 33%, transparent);
}


/* =========================
   五間戲院顏色
========================= */

.baogong {
  --neon: #ff493d;
}

.century {
  --neon: #f57418;
}

.broadway {
  --neon: #cd47d6;
}

.ylc {
  --neon: #338cff;
}

.arthouse {
  --neon: #58c96b;
}


/* =========================
   卡片文字
========================= */

.cinema-card h2 {
  color: var(--neon);
  font-size: 27px;
  margin: 5px 0 8px;

  text-shadow:
    0 0 10px color-mix(in srgb, var(--neon) 45%, transparent);
}

.type {
  color: #ddd;
  font-size: 15px;
  margin-bottom: 25px;
}

.info {
  color: #bbb;
  line-height: 2;
  font-size: 14px;
}


/* =========================
   按鈕
========================= */

.select-button {

  width: 100%;

  margin-top: 25px;
  padding: 13px 8px;

  border: 1px solid var(--neon);
  border-radius: 30px;

  color: white;

  font-size: 17px;
  font-weight: bold;

  background:
    linear-gradient(
      135deg,
      color-mix(in srgb, var(--neon) 60%, #111),
      color-mix(in srgb, var(--neon) 30%, #111)
    );

  box-shadow:
    0 0 8px color-mix(in srgb, var(--neon) 35%, transparent),
    inset 0 0 10px rgba(255,255,255,0.12);

  cursor: pointer;

  transition: 0.2s;
}


.select-button:hover {

  transform: scale(1.03);

  box-shadow:
    0 0 8px var(--neon),
    0 0 18px color-mix(in srgb, var(--neon) 60%, transparent),
    0 0 30px color-mix(in srgb, var(--neon) 30%, transparent);
}


/* =========================
   手機
========================= */

@media (max-width: 600px) {

  .cinema-card {
    width: 100%;
  }

  .subtitle {
    font-size: 16px;
    letter-spacing: 0.08em;
  }
}


.cards { max-width: 1600px; align-items: stretch; }
.cinema-card { width: calc(20% - 16px); min-width: 240px; padding: 0; overflow: hidden; display:flex; flex-direction:column; }
.card-content { padding: 22px; display:flex; flex-direction:column; flex:1; justify-content:center; }
.cinema-card h2 { font-size:24px; }
.cinema-visual { margin:0; position:relative; background:#171717; overflow:hidden; }
.cinema-visual img { width:100%; height:auto; aspect-ratio: 2 / 1; object-fit:cover; display:block; }
button:focus-visible { outline:3px solid white; outline-offset:4px; }
.cinema-card.selected { outline:2px solid var(--neon); outline-offset:4px; }
.type { margin-bottom:0; min-height:22px; color:#e0d8cb; line-height:1.6; }
.description { flex:1; margin:10px 0 0; font-size:14px; line-height:1.75; color:#afa99f; }
.selection { margin:20px auto 24px; max-width:900px; text-align:center; border:1px solid #8d7043; border-radius:18px; padding:24px; background:#17130d; }
.selection h2 { color:#ffd47c; margin-top:0; }
.confirm-button { min-width:140px; min-height:48px; padding:12px 32px; border:1px solid #ffd47c; border-radius:28px; background:#ffd47c; color:#211506; font-size:17px; font-weight:bold; cursor:pointer; }
.confirm-button:disabled { background:#423820; color:#f4e2ba; cursor:default; }
.selection h2 { font-size:clamp(19px, 4vw, 26px); line-height:1.5; }
.status { text-align:center; color:#c7ae82; margin:20px; }
@media(max-width:760px) {
  .cards { padding:16px; gap:24px; }
  .cinema-card {
    width:100%; min-width:0; min-height:0;
    height:min(520px, calc(100svh - 32px));
    display:grid; grid-template-rows:minmax(0, 1fr) auto minmax(0, 1fr);
  }
  .cinema-visual { min-height:0; }
  .cinema-visual img { height:100%; aspect-ratio:auto; object-fit:cover; }
  .cinema-visual img { object-position:center; }
  .card-content { padding:16px 20px; }
  .cinema-card h2 { font-size:23px; margin:0 0 6px; }
  .type { min-height:0; margin-bottom:0; font-size:14px; }
  .description { flex:none; margin-top:8px; font-size:14px; line-height:1.65; }
  .select-button { margin-top:14px; min-height:48px; padding:11px 8px; }
  .selection { margin:20px 16px; }
  .header { padding:24px 16px 12px; }
  .status { margin:12px 16px; font-size:14px; line-height:1.6; }
}
/* A finite three-dimensional carousel: cards stay upright along a shallow arc. */
.stage-scroll { position:relative; overflow:hidden; touch-action:pan-y; }
.cards {
  position:relative; isolation:isolate; display:block;
  width:100%; min-width:0; max-width:1500px; height:720px;
  margin:0 auto; padding:0; perspective:1100px;
}
.cards::before {
  content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
  opacity:0; transition:opacity .5s ease;
  background:radial-gradient(ellipse 280px 460px at 50% 43%, #fff1c74d, #ffd47c20 48%, transparent 74%);
}
.cards.has-selection::before { opacity:1; }
.cards::after {
  content:""; position:absolute; left:7%; right:7%; bottom:38px; height:110px;
  border-radius:50%; z-index:-1; pointer-events:none;
  background:radial-gradient(ellipse, #ffd47c0d, #ffd47c03 48%, transparent 72%);
  border-bottom:1px solid #ffd47c16;
}
.cinema-card {
  position:absolute; left:50%; top:75px;
  width:280px; min-width:0; min-height:0; height:540px; padding:0;
  display:grid; grid-template-rows:minmax(0, 1fr) auto minmax(0, 1fr);
  transform-origin:center;
  transform:translateX(calc(-50% + var(--orbit-x))) translateY(var(--orbit-y)) translateZ(var(--orbit-z)) rotateY(var(--orbit-yaw)) scale(var(--orbit-scale));
  z-index:var(--orbit-layer); filter:brightness(1) saturate(1);
  animation:card-float 5s ease-in-out infinite; animation-delay:var(--float-delay);
  cursor:pointer;
  box-shadow:0 22px 42px #000b, 0 0 14px color-mix(in srgb, var(--neon) 15%, transparent);
  transition:transform .6s cubic-bezier(.2,.7,.2,1), filter .45s ease, box-shadow .45s ease;
}
.cinema-card .cinema-visual { min-height:0; }
.cinema-card .cinema-visual img { height:100%; aspect-ratio:auto; object-position:center; }
.cinema-card .card-content { padding:18px; }
.cinema-card .type { min-height:0; margin:0; font-size:14px; }
.cinema-card .description { flex:none; font-size:14px; line-height:1.65; margin-top:8px; }
.cinema-card .select-button { margin-top:16px; min-height:48px; padding:11px 8px; }
.cinema-card:hover { filter:brightness(1) saturate(1); }
.cinema-card.selected, .cinema-card.selected:hover {
  filter:brightness(1.22) saturate(1.08);
  box-shadow:0 30px 65px #000c, 0 0 38px color-mix(in srgb, var(--neon) 65%, transparent), 0 -18px 70px #ffd47c4d;
  animation-name:selected-float;
}
.carousel-controls { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); display:flex; gap:16px; }
.carousel-arrow { width:48px; height:48px; border-radius:50%; border:1px solid #8d7043; color:#ffd47c; background:#17130d; font-size:28px; cursor:pointer; }
.carousel-arrow:disabled { opacity:.25; cursor:default; }
@media(max-width:760px) {
  .cards { height:calc(min(480px, 100svh - 72px) + 130px); perspective:750px; }
  .cinema-card { width:270px; height:min(480px, calc(100svh - 72px)); top:55px; }
  .cinema-card .card-content { padding:14px 16px; }
  .cinema-card .description { font-size:13px; }
  .cinema-card h2 { font-size:22px; }
  .cards::after { bottom:42px; height:80px; }
}
/* Compact confirmation keeps the active card close to the heading. */
.selection:not([hidden]) { display:flex; align-items:center; justify-content:center; gap:18px; }
.selection { max-width:680px; margin:12px auto; padding:12px 18px; }
.selection h2 { margin:0; font-size:20px; }
.confirm-button { min-width:84px; min-height:44px; padding:10px 20px; flex-shrink:0; }
@media(max-width:760px) {
  .header { padding:12px 16px 4px; }
  .logo { font-size:48px; }
  .subtitle { font-size:14px; line-height:1.65; letter-spacing:.08em; margin-top:6px; padding:6px 8px; }
  .subtitle::before { margin-bottom:6px; }
  .subtitle::after { margin-top:6px; }
  .status { margin:6px 12px; font-size:13px; }
  .selection { margin:6px 12px; padding:9px 12px; gap:10px; border-radius:14px; }
  .selection h2 { font-size:16px; line-height:1.45; }
  .confirm-button { min-width:64px; padding:9px 14px; font-size:15px; }
  .cards { --mobile-card-height:clamp(230px, calc(100svh - 350px), 480px); height:calc(var(--mobile-card-height) * 1.09 + 68px); }
  .cinema-card { height:var(--mobile-card-height); top:34px; }
  .cinema-card .card-content { padding:12px 16px; }
  .cinema-card .select-button { margin-top:10px; min-height:44px; padding:9px 8px; }
  .carousel-controls { bottom:4px; gap:14px; }
  .carousel-arrow { width:44px; height:44px; }
}
@keyframes card-float { 0%, 100% { translate:0 0; } 50% { translate:0 -5px; } }
@keyframes selected-float { 0%, 100% { translate:0 0; } 50% { translate:0 -2px; } }
.card-shadow {
  position:absolute; left:50%; top:650px; width:230px; height:28px;
  border-radius:50%; pointer-events:none; z-index:0;
  background:radial-gradient(ellipse, #e5e7eb85 0%, #c0c5cb44 40%, transparent 72%);
  filter:blur(6px); opacity:.7;
  transform:translateX(calc(-50% + var(--orbit-x))) translateY(var(--orbit-ground-y)) translateZ(var(--orbit-z));
  transition:transform .6s cubic-bezier(.2,.7,.2,1), opacity .45s;
}
.card-shadow.highlighted { opacity:1; }
.carousel-controls { z-index:50; }
@media(max-width:760px) {
  .card-shadow { top:calc(var(--mobile-card-height) * 1.045 + 46px); width:200px; height:22px; }
}
@media(prefers-reduced-motion:reduce) {
  *, *::before, *::after { transition:none !important; animation:none !important; scroll-behavior:auto !important; }
  .select-button:hover { transform:none; }
}

.site-footer { text-align:center; padding:12px 16px 20px; color:#afa99f; font-size:12px; line-height:1.8; }
.site-footer a { color:#e8cfa4; text-decoration:underline; text-underline-offset:3px; }
.site-footer a:hover { color:#ffd47c; }
.site-footer a:focus-visible { outline:2px solid #ffd47c; outline-offset:4px; }
.entry-transition { position:fixed; inset:0; z-index:1000; overflow:hidden; }
.entry-curtain { position:absolute; inset-block:0; width:50.2%; background:repeating-linear-gradient(90deg,#180b08 0,#381b13 8%,#1c0e0a 17%,#30160e 25%); box-shadow:0 0 50px #000c; transition:transform .45s cubic-bezier(.35,0,.15,1); }
.entry-left { left:0; transform:translateX(-102%); }
.entry-right { right:0; transform:translateX(102%); }
.entry-transition.closing .entry-curtain { transform:translateX(0); }
.entry-title { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; color:#ffd47c; opacity:0; transition:opacity .15s .2s; }
.entry-title > span { font:bold 48px Georgia,serif; text-shadow:0 0 24px #ff9d0080; }
.entry-title p { font-size:14px; letter-spacing:.1em; color:#e8cfa4; }
.entry-transition.closing .entry-title { opacity:1; }
.entering-game .cinema-card, .entering-game .card-shadow { animation-play-state:paused; }
.entry-curtain { will-change:transform; }
</style>
</head>


<body>
<header class="header">
  <h1 class="logo">CineMan</h1>
  <p class="subtitle">享受自己擁有一家電影院的美麗與哀愁</p>
</header>
<p class="status" id="status" role="status">正在載入戲院資料…</p>
<section class="selection" id="selection" aria-labelledby="selection-title" hidden>
  <h2 id="selection-title"></h2>
  <button type="button" id="confirm-selection" class="confirm-button">確定</button>
</section>
<div class="stage-scroll" id="stage-scroll" tabindex="0" aria-label="戲院舞台，可左右滑動或使用方向鍵切換">
  <main class="cards" id="cinemas" aria-label="五種戲院"></main>
  <div class="carousel-controls" aria-label="切換戲院">
    <button type="button" class="carousel-arrow" id="previous-cinema" aria-label="上一家戲院">‹</button>
    <button type="button" class="carousel-arrow" id="next-cinema" aria-label="下一家戲院">›</button>
  </div>
</div>
<footer class="site-footer">©2026 CineMan · Developed by <a href="https://www.facebook.com/FRONTDELIBERATIONCINEMA" target="_blank" rel="noopener noreferrer">電影解放陣線</a></footer>
<script src="app.js?v=entry-fast-v18" defer></script>
</body>
</html>
