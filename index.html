<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CineMan｜選擇你的電影院</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at top, #241108 0%, #090909 40%, #000 100%);
  color: white;
  font-family: Arial, "Noto Sans TC", sans-serif;
}


/* =========================
   CineMan 標題
========================= */

.header {
  text-align: center;
  padding: 45px 20px 30px;
}

.logo {
  margin: 0;

  font-family: Georgia, serif;
  font-size: clamp(52px, 8vw, 92px);
  font-weight: bold;

  color: #ffd47c;

  text-shadow:
    0 0 2px #fff,
    0 0 6px #ffd36b,
    0 0 12px #ff9d00,
    0 0 25px #ff7200,
    0 0 45px rgba(255, 105, 0, 0.65);
}

.subtitle {
  margin-top: 8px;
  font-size: 22px;
  letter-spacing: 8px;
  color: #f4e2ba;
}


/* =========================
   卡片區
========================= */

.cards {
  display: flex;
  gap: 16px;

  max-width: 1450px;
  margin: auto;
  padding: 20px;

  justify-content: center;
  flex-wrap: wrap;
}


/* =========================
   卡片共用樣式
========================= */

.cinema-card {

  --neon: #ffffff;

  width: 250px;
  min-height: 360px;

  padding: 22px;

  border: 1px solid var(--neon);
  border-radius: 18px;

  background:
    linear-gradient(
      180deg,
      color-mix(in srgb, var(--neon) 10%, #101010),
      #090909 45%
    );

  box-shadow:
    0 0 8px rgba(255,255,255,0.05),
    0 0 20px color-mix(in srgb, var(--neon) 22%, transparent);

  transition: 0.25s;
}


/* 滑鼠移上去 */

.cinema-card:hover {

  transform: translateY(-5px);

  box-shadow:
    0 0 10px color-mix(in srgb, var(--neon) 50%, transparent),
    0 0 28px color-mix(in srgb, var(--neon) 28%, transparent);
}


/* =========================
   五間戲院顏色
========================= */

.baogong {
  --neon: #ff493d;
}

.century {
  --neon: #e3a52b;
}

.broadway {
  --neon: #338cff;
}

.ylc {
  --neon: #a45cff;
}

.arthouse {
  --neon: #58c96b;
}


/* =========================
   卡片文字
========================= */

.cinema-card h2 {
  color: var(--neon);
  font-size: 27px;
  margin: 5px 0 8px;

  text-shadow:
    0 0 10px color-mix(in srgb, var(--neon) 45%, transparent);
}

.type {
  color: #ddd;
  font-size: 15px;
  margin-bottom: 25px;
}

.info {
  color: #bbb;
  line-height: 2;
  font-size: 14px;
}


/* =========================
   按鈕
========================= */

.select-button {

  width: 100%;

  margin-top: 25px;
  padding: 13px 8px;

  border: 1px solid var(--neon);
  border-radius: 30px;

  color: white;

  font-size: 17px;
  font-weight: bold;

  background:
    linear-gradient(
      135deg,
      color-mix(in srgb, var(--neon) 60%, #111),
      color-mix(in srgb, var(--neon) 30%, #111)
    );

  box-shadow:
    0 0 8px color-mix(in srgb, var(--neon) 35%, transparent),
    inset 0 0 10px rgba(255,255,255,0.12);

  cursor: pointer;

  transition: 0.2s;
}


.select-button:hover {

  transform: scale(1.03);

  box-shadow:
    0 0 8px var(--neon),
    0 0 18px color-mix(in srgb, var(--neon) 60%, transparent),
    0 0 30px color-mix(in srgb, var(--neon) 30%, transparent);
}


/* =========================
   手機
========================= */

@media (max-width: 600px) {

  .cinema-card {
    width: 100%;
  }

  .subtitle {
    font-size: 16px;
    letter-spacing: 4px;
  }
}


.cards { max-width: 1600px; align-items: stretch; }
.cinema-card { width: calc(20% - 16px); min-width: 240px; padding: 0; overflow: hidden; display:flex; flex-direction:column; }
.card-content { padding: 22px; display:flex; flex-direction:column; flex:1; justify-content:center; }
.cinema-card h2 { font-size:24px; }
.cinema-visual { margin:0; position:relative; background:#171717; overflow:hidden; }
.cinema-visual img { width:100%; height:auto; aspect-ratio: 2 / 1; object-fit:cover; display:block; }
button:focus-visible { outline:3px solid white; outline-offset:4px; }
.cinema-card.selected { outline:2px solid var(--neon); outline-offset:4px; }
.type { margin-bottom:18px; min-height:22px; }
.selection { margin:20px auto 24px; max-width:900px; text-align:center; border:1px solid #8d7043; border-radius:18px; padding:24px; background:#17130d; }
.selection h2 { color:#ffd47c; margin-top:0; }
.confirm-button { min-width:140px; min-height:48px; padding:12px 32px; border:1px solid #ffd47c; border-radius:28px; background:#ffd47c; color:#211506; font-size:17px; font-weight:bold; cursor:pointer; }
.confirm-button:disabled { background:#423820; color:#f4e2ba; cursor:default; }
.selection h2 { font-size:clamp(19px, 4vw, 26px); line-height:1.5; }
.status { text-align:center; color:#c7ae82; margin:20px; }
@media(max-width:760px) {
  .cards { padding:16px; gap:24px; }
  .cinema-card {
    width:100%; min-width:0; min-height:0;
    height:min(520px, calc(100svh - 32px));
    display:grid; grid-template-rows:minmax(0, 1fr) auto minmax(0, 1fr);
  }
  .cinema-visual { min-height:0; }
  .cinema-visual img { height:100%; aspect-ratio:auto; object-fit:cover; }
  .cinema-visual img { object-position:center; }
  .card-content { padding:16px 20px; }
  .cinema-card h2 { font-size:23px; margin:0 0 6px; }
  .type { min-height:0; margin-bottom:0; font-size:14px; }
  .select-button { margin-top:14px; min-height:48px; padding:11px 8px; }
  .selection { margin:20px 16px; }
  .header { padding:24px 16px 12px; }
  .status { margin:12px 16px; font-size:14px; line-height:1.6; }
}
@media(prefers-reduced-motion:reduce) { * { transition:none !important; } .cinema-card:hover,.select-button:hover { transform:none; } }
</style>
</head>


<body>
<header class="header">
  <h1 class="logo">CineMan</h1>
  <div class="subtitle">選擇你的電影院</div>
</header>
<p class="status" id="status" role="status">正在載入戲院資料…</p>
<section class="selection" id="selection" aria-labelledby="selection-title" hidden>
  <h2 id="selection-title"></h2>
  <button type="button" id="confirm-selection" class="confirm-button">確定</button>
</section>
<main class="cards" id="cinemas" aria-label="五種戲院"></main>
<script src="app.js?v=clean-start-v5" defer></script>
</body>
</html>
